[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-tab"
version = "0.3.0"
description = "CPU-only local personalized Tab completion with asynchronous learning"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["playwright==1.57.0"]

[project.scripts]
personal-tab = "personal_tab.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_tab = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
