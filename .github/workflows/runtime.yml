name: CPU runtime verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install -e ".[test,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -rs
        env:
          PERSONAL_TAB_REQUIRE_E2E: '1'
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait demo
      - run: python tools/http_smoke.py --url http://127.0.0.1:8765
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
